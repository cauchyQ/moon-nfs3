name: CI
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, native]
    steps:
      - uses: actions/checkout@v5
      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- '0.10.14+7d59c7ec9'
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon update
      - run: moon check --target ${{ matrix.target }} --deny-warn
      - run: moon build --target ${{ matrix.target }} --deny-warn
      - run: moon test --target ${{ matrix.target }} --deny-warn
      - run: moon run cmd/main --target ${{ matrix.target }} -- --help
      - name: Generated interfaces and formatting
        run: |
          moon info
          moon fmt
          git diff --exit-code
      - name: Install independent NFS server
        if: matrix.target == 'wasm'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nfs-ganesha nfs-ganesha-mem rpcbind
          sudo systemctl stop nfs-ganesha
          sudo systemctl start rpcbind
          sudo mkdir -p /run/ganesha
          sudo ganesha.nfsd -f "$PWD/validation/ganesha.conf" -L "$RUNNER_TEMP/ganesha.log" -p "$RUNNER_TEMP/moonnfs3.pid"
          python - <<'PY'
          import socket, time
          for attempt in range(50):
              try:
                  with socket.create_connection(('127.0.0.1', 20491), timeout=1):
                      break
              except OSError:
                  time.sleep(0.1)
          else:
              raise RuntimeError('NFS-Ganesha failed to start')
          PY
      - name: Real NFSv3 interoperability and CLI transfer
        if: matrix.target == 'wasm'
        run: |
          python validation/integration.py
          python validation/integration.py --discovery
      - name: NFS server log on failure
        if: failure() && matrix.target == 'wasm'
        run: sudo cat "$RUNNER_TEMP/ganesha.log" || true
